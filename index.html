</script>
<style>
@font-face{font-family:"Inter";font-style:normal;font-weight:100 900;font-display:swap;src:url(fonts/inter-latin.woff2) format("woff2");unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+0304,U+0308,U+0329,U+2000-206F,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD}
@font-face{font-family:"Noto Sans Georgian";font-style:normal;font-weight:100 900;font-display:swap;src:url(fonts/noto-sans-georgian.woff2) format("woff2");unicode-range:U+0589,U+10A0-10FF,U+1C90-1CBA,U+1CBD-1CBF,U+205A,U+2D00-2D2F,U+2E31}

:root{
  --font:"Inter","Noto Sans Georgian",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --bg:#F3F5F8; --surface:#FFFFFF; --surface2:#EDF1F5; --seg-on:#FFFFFF;
  --ink:#0D1B2A; --ink2:#3A4B5E; --mute:#5E6F82; --line:#E2E8EF;
  --brand:#1166E0; --on-brand:#FFFFFF; --hero:#0E5FD8;
  --warn:#B4470C; --warn-bg:#FDEEE2; --ok:#0B7A55; --ok-bg:#E1F4EC;
  --bar:rgba(243,245,248,.84);
  --card-shadow:0 1px 2px rgba(13,27,42,.05),0 10px 28px -14px rgba(13,27,42,.16);
  color-scheme:light;
}
html[data-theme=dark]{
  --bg:#0A0F15; --surface:#121A23; --surface2:#19232E; --seg-on:#2B3948;
  --ink:#EDF2F7; --ink2:#C3CFDB; --mute:#8D9FB1; --line:#1F2B38;
  --brand:#5AAAFF; --on-brand:#04223F; --hero:#12396F;
  --warn:#FFA766; --warn-bg:#2E1D11; --ok:#43D6A2; --ok-bg:#0F2A22;
  --bar:rgba(10,15,21,.84);
  --card-shadow:0 0 0 1px #1F2B38;
  color-scheme:dark;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html{background:var(--bg)}
body{
  font:15px/1.4 var(--font);color:var(--ink);background:var(--bg);
  min-height:100dvh;-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;
  overscroll-behavior-y:none;
}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;touch-action:manipulation}
a{color:inherit}
:focus-visible{outline:2px solid var(--brand);outline-offset:2px;border-radius:8px}
.ic{width:20px;height:20px;fill:currentColor;flex:none}
.num{font-variant-numeric:tabular-nums}

.app{max-width:560px;margin:0 auto;padding:0 16px calc(96px + env(safe-area-inset-bottom))}

/* top bar */
.bar{
  position:sticky;top:0;z-index:10;margin:0 -16px;padding:calc(10px + env(safe-area-inset-top)) 16px 10px;
  display:flex;align-items:center;justify-content:space-between;gap:12px;
  background:var(--bar);-webkit-backdrop-filter:saturate(180%) blur(18px);backdrop-filter:saturate(180%) blur(18px);
  border-bottom:1px solid var(--line);
}
.brand{display:flex;align-items:center;gap:12px;min-width:0}
.logo{width:36px;height:36px;border-radius:10px;display:block}
.brand h1{font-size:17px;font-weight:650;letter-spacing:-.01em;line-height:1.15}
.stamp{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--mute);margin-top:2px}
.stamp i{width:6px;height:6px;border-radius:50%;background:var(--ok)}
.stale .stamp i{background:var(--warn)}
.icon-btn{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;color:var(--ink2);margin-right:-6px}
.icon-btn:active{background:var(--surface2)}
.busy .icon-btn .ic{animation:rot .8s linear infinite}
@keyframes rot{to{transform:rotate(360deg)}}

/* chips */
.chips{display:flex;gap:8px;overflow-x:auto;margin:0 -16px;padding:14px 16px 2px;scrollbar-width:none;overscroll-behavior-x:contain}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;height:36px;padding:0 14px;border-radius:999px;display:flex;align-items:center;gap:8px;font-size:14px;font-weight:550;color:var(--ink2);background:var(--surface);border:1px solid var(--line);white-space:nowrap}
.chip[aria-pressed=true]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.chip em{font-style:normal;min-width:18px;height:18px;padding:0 5px;border-radius:9px;display:grid;place-items:center;font-size:11px;font-weight:700;background:var(--warn-bg);color:var(--warn)}
.chip[aria-pressed=true] em{background:var(--bg);color:var(--ink)}

/* hero */
.hero{margin-top:14px;padding:22px 22px 20px;border-radius:26px;background:var(--hero);color:#fff;box-shadow:var(--card-shadow)}
.hero .scope{display:flex;align-items:center;gap:6px;font-size:13px;font-weight:550;opacity:.8}
.hero .scope .ic{width:16px;height:16px}
.hero .label{margin-top:18px;font-size:15px;font-weight:500;opacity:.88}
.hero .time{margin-top:2px;font-size:60px;line-height:1.05;font-weight:700;letter-spacing:-.035em}
.hero .time.sm{font-size:38px;letter-spacing:-.03em}
.hero .sub{margin-top:8px;font-size:15px;font-weight:500;opacity:.88}
.hero.clear{background:var(--surface);color:var(--ink);border:1px solid var(--line);display:flex;gap:16px;align-items:center}
html[data-theme=dark] .hero.clear{border-color:var(--line)}
.hero.clear .tile{width:52px;height:52px;border-radius:16px;display:grid;place-items:center;background:var(--ok-bg);color:var(--ok)}
.hero.clear .tile .ic{width:28px;height:28px}
.hero.clear .t{font-size:18px;font-weight:650;letter-spacing:-.01em}
.hero.clear .s{margin-top:2px;font-size:14px;color:var(--mute)}

/* cards */
.cards{list-style:none;display:grid;gap:12px;margin-top:14px}
.card{background:var(--surface);border-radius:22px;padding:16px;box-shadow:var(--card-shadow)}
html[data-theme=dark] .card{border:0}
.card.done{opacity:.62}
.top{display:flex;align-items:center;gap:12px}
.tile{width:42px;height:42px;border-radius:13px;display:grid;place-items:center;flex:none;background:var(--warn-bg);color:var(--warn)}
.done .tile{background:var(--surface2);color:var(--mute)}
.tile .ic{width:24px;height:24px}
.ttl{min-width:0;flex:1}
.ttl h3{font-size:16px;font-weight:650;letter-spacing:-.01em;line-height:1.25;overflow-wrap:anywhere}
.ttl p{margin-top:2px;font-size:13px;color:var(--mute)}
.pill{flex:none;align-self:flex-start;height:24px;padding:0 10px;border-radius:12px;display:flex;align-items:center;font-size:12px;font-weight:650;background:var(--warn-bg);color:var(--warn)}
.done .pill{background:var(--surface2);color:var(--mute)}

.metrics{display:grid;grid-template-columns:1fr auto;gap:16px;align-items:end;margin-top:18px}
.lbl{display:block;font-size:12px;font-weight:550;color:var(--mute)}
.big{display:block;margin-top:2px;font-size:34px;line-height:1.05;font-weight:700;letter-spacing:-.03em}
.big.sm{font-size:24px}
.mid{display:block;margin-top:4px;font-size:18px;font-weight:650;letter-spacing:-.01em;text-align:right}
.metrics>div:last-child .lbl{text-align:right}

.track{height:6px;border-radius:3px;background:var(--surface2);margin-top:16px;overflow:hidden}
.track i{display:block;height:100%;border-radius:3px;background:var(--brand)}
.done .track i{background:var(--ok)}
.range{display:flex;justify-content:space-between;margin-top:6px;font-size:12px;color:var(--mute)}

.streets{margin-top:16px;padding-top:14px;border-top:1px solid var(--line)}
.st-h{display:flex;align-items:center;gap:6px;font-size:12px;font-weight:650;color:var(--mute)}
.st-h .ic{width:16px;height:16px}
.st-t{margin-top:6px;font-size:15px;line-height:1.5;color:var(--ink);overflow-wrap:anywhere}
.st-t.clamp{display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.more{margin-top:6px;font-size:14px;font-weight:600;color:var(--brand);padding:4px 0}

/* notes */
.note{display:flex;gap:12px;align-items:center;margin-top:12px;padding:12px 14px;border-radius:16px;background:var(--surface);box-shadow:var(--card-shadow);font-size:14px}
.note.warn{background:var(--warn-bg);color:var(--warn);box-shadow:none}
.note .grow{flex:1;min-width:0;line-height:1.35}
.note .ic{width:22px;height:22px}
.note .x{width:32px;height:32px;display:grid;place-items:center;border-radius:10px;color:var(--mute);margin-right:-6px}
.btn{height:36px;padding:0 16px;border-radius:12px;background:var(--brand);color:var(--on-brand);font-size:14px;font-weight:650}
.btn:active{transform:scale(.97)}
.inl{display:inline-block;vertical-align:-4px;margin:0 2px}

/* settings */
.h2{margin:22px 4px 6px;font-size:30px;font-weight:700;letter-spacing:-.03em}
.group{margin-top:14px;background:var(--surface);border-radius:22px;box-shadow:var(--card-shadow);overflow:hidden}
.blk{padding:16px}
.blk+.blk,.rowbtn+.rowbtn,.blk+.rowbtn,.rowbtn+.blk{border-top:1px solid var(--line)}
.blk-h{display:flex;align-items:center;gap:10px;font-size:15px;font-weight:600;margin-bottom:12px}
.blk-h .ic{color:var(--brand)}
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:2px;padding:3px;border-radius:13px;background:var(--surface2)}
.seg button{height:38px;border-radius:10px;display:flex;align-items:center;justify-content:center;gap:6px;font-size:14px;font-weight:550;color:var(--mute)}
.seg button .ic{width:18px;height:18px}
.seg button[aria-pressed=true]{background:var(--seg-on);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.14)}
.rowbtn{width:100%;display:flex;align-items:center;gap:12px;padding:16px;text-align:left;font-size:15px;font-weight:550}
.rowbtn .ic:first-child{color:var(--brand)}
.rowbtn .grow{flex:1;min-width:0}
.rowbtn small{display:block;margin-top:2px;font-size:13px;font-weight:400;color:var(--mute);line-height:1.4}
.rowbtn .chev{color:var(--mute);width:18px;height:18px}
.rowbtn:active{background:var(--surface2)}
.about{padding:16px;font-size:13px;line-height:1.55;color:var(--mute)}
.about a{color:var(--brand);font-weight:600;text-decoration:none}
.about p+p{margin-top:8px}

/* tab bar */
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:10;background:var(--bar);-webkit-backdrop-filter:saturate(180%) blur(18px);backdrop-filter:saturate(180%) blur(18px);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
.tabbar div{max-width:560px;margin:0 auto;display:grid;grid-template-columns:1fr 1fr 1fr}
.tabbar button{height:62px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:11px;font-weight:600;color:var(--mute)}
.tabbar button .ic{width:26px;height:26px}
.tabbar button[aria-current=page]{color:var(--brand)}

.fade{animation:fade .22s ease both}
@keyframes fade{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.fade{animation:none}.busy .icon-btn .ic{animation-duration:2s}}

/* my water */
.form{display:grid;gap:10px}
.in{width:100%;height:46px;padding:0 14px;border-radius:12px;border:1px solid var(--line);background:var(--surface2);color:var(--ink);font:inherit;font-size:16px}
.hint{margin-top:8px;font-size:13px;color:var(--mute);line-height:1.4}
.tile.okt{background:var(--ok-bg);color:var(--ok)}
.pill.okp{background:var(--ok-bg);color:var(--ok)}
.rm{margin-top:10px;font-size:13px;font-weight:600;color:var(--mute);padding:4px 0}
.btn.big{width:100%;height:48px;border-radius:14px;font-size:16px}
/* install sheet */
.sheet{position:fixed;inset:0;z-index:30;display:flex;align-items:flex-end;justify-content:center}
.sheet-bg{position:absolute;inset:0;background:rgba(0,0,0,.45);animation:fade .2s both}
.sheet-card{position:relative;width:100%;max-width:560px;padding:24px 20px calc(20px + env(safe-area-inset-bottom));border-radius:26px 26px 0 0;background:var(--surface);text-align:center;animation:up .28s ease both}
.sheet-card img{border-radius:14px}
.sheet-card h2{margin-top:12px;font-size:20px;letter-spacing:-.02em}
.sheet-card p{margin:8px 0 18px;font-size:15px;color:var(--mute)}
.ghost{width:100%;height:44px;margin-top:6px;font-weight:600;color:var(--mute)}
@keyframes up{from{transform:translateY(100%)}to{transform:none}}
</style>
</head>

    alertsIos:'iPhone-ზე შეტყობინებებისთვის დააყენე აპი მთავარ ეკრანზე.', notifTitle:'წყლის გათიშვა შენს ქუჩაზე'
  }
};

/* ---------- state ---------- */
const mem = {};
const store = {
  get(k){ try { return localStorage.getItem(k); } catch(e){ return mem[k] ?? null; } },
  set(k,v){ try { localStorage.setItem(k,v); } catch(e){ mem[k] = v; } }
};
let lang  = store.get('lang') || ((navigator.language||'').toLowerCase().startsWith('ka') ? 'ka' : 'en');
let theme = store.get('theme') || 'system';
let sel   = store.get('district') || 'all';
let tab   = (() => { try { return JSON.parse(store.get('watch')).length ? 'mine' : 'outages'; } catch (e) { return 'outages'; } })();
let data  = null, fresh = null, loaded = false, deferred = null;
const openIds = new Set();

const t = (k, v) => {
  let s = (T[lang] && T[lang][k]) ?? T.en[k] ?? k;
  if (v) for (const x in v) s = s.replace('{' + x + '}', v[x]);
  return s;
};
const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const ic = (n, c = '') => `<svg class="ic ${c}" aria-hidden="true"><use href="#i-${n}"/></svg>`;

/* ---------- time ---------- */
const TB = 4 * 36e5, DAY = 864e5;       // Tbilisi is UTC+4, no DST
const p2 = n => String(n).padStart(2,'0');
const nowWall = () => Date.now() + TB;
const clock = ms => { const d = new Date(ms); return p2(d.getUTCHours()) + ':' + p2(d.getUTCMinutes()); };
const clean = s => String(s || '').replace(/[\u00a0\s]+/g, ' ').trim();
function when(ms, now){
  const off = Math.floor(ms / DAY) - Math.floor(now / DAY);
  if (off === 0) return clock(ms);
  if (off === 1) return t('tomorrow') + ' ' + clock(ms);
  const d = new Date(ms);
  return p2(d.getUTCDate()) + '.' + p2(d.getUTCMonth() + 1) + ' ' + clock(ms);
}
function left(ms){
  const mins = Math.max(1, Math.round(ms / 6e4)), h = Math.floor(mins / 60), m = mins % 60;
  return h ? (m ? `${h} ${t('h')} ${m} ${t('min')}` : `${h} ${t('h')}`) : `${m} ${t('min')}`;
}
function parseISO(s){
  const v = Date.parse(String(s || '').replace(/(\.\d{3})\d+/, '$1'));
  return isNaN(v) ? Date.now() : v;
}
/* the source writes dates as dd/mm/yyyy or mm/dd/yyyy: pick the reading closest to the update time */
function pickDate(a, b, y, ref){
  let best = null, bd = Infinity;
  for (const [m, d] of [[b, a], [a, b]]) {
    if (m < 1 || m > 12 || d < 1 || d > 31) continue;
    const diff = Math.abs(Date.UTC(y, m - 1, d, 12) - ref);
    if (diff < bd) { bd = diff; best = [m, d]; }
  }
  return best;
}
function parseTimes(text, ref){
  const s = clean(text);
  let start = null, end = null;
  const mf = s.match(/(\d{1,2})\/(\d{1,2})\/(\d{4})\s+(\d{1,2}):(\d{2})\s*დან/);
  if (mf) { const r = pickDate(+mf[1], +mf[2], +mf[3], ref); if (r) start = Date.UTC(+mf[3], r[0]-1, r[1], +mf[4], +mf[5]); }
  const re = /(?:(\d{1,2})\/(\d{1,2})\/(\d{4})\s+)?(\d{1,2}):(\d{2})\s*საათამდე/g;
  let m, last = null;
  while ((m = re.exec(s))) last = m;
  if (last) {
    if (last[1]) {
      const r = pickDate(+last[1], +last[2], +last[3], ref);
      if (r) end = Date.UTC(+last[3], r[0]-1, r[1], +last[4], +last[5]);
    } else {
      const d = new Date(ref);
      let e = Date.UTC(d.getUTCFullYear(), d.getUTCMonth(), d.getUTCDate(), +last[4], +last[5]);
      if (e < ref - 3 * 36e5) e += DAY;
      end = e;
    }
  }
  return {start, end};
}

/* ---------- text ---------- */
const MAP = {ა:'a',ბ:'b',გ:'g',დ:'d',ე:'e',ვ:'v',ზ:'z',თ:'t',ი:'i',კ:'k',ლ:'l',მ:'m',ნ:'n',ო:'o',პ:'p',ჟ:'zh',რ:'r',ს:'s',ტ:'t',უ:'u',ფ:'p',ქ:'k',ღ:'gh',ყ:'q',შ:'sh',ჩ:'ch',ც:'ts',ძ:'dz',წ:'ts',ჭ:'ch',ხ:'kh',ჯ:'j',ჰ:'h'};
const latin = s => s.replace(/[\u10D0-\u10FF]+/g, (w, off, all) => {
  const r = [...w].map(c => MAP[c] || c).join('');
  return (off === 0 || /[\s,(]/.test(all[off - 1])) ? r.charAt(0).toUpperCase() + r.slice(1) : r;
});
const tx = s => lang === 'en' ? latin(s) : s;
function streetsOf(a){
  const m = clean(a.email_text).match(/(?:შეუწყდება|შეწყვეტილი აქვს|შეეწყვეტება)\s*:\s*(.+)$/);
  let s = m ? m[1].trim() : '';
  if (a.district_ka && s.startsWith(a.district_ka)) s = s.slice(a.district_ka.length).replace(/^[\s,]+/, '');
  return s.replace(/[\s,;.]+$/, '');
}
const dName = a => lang === 'ka' ? (a.district_ka || a.district_en) : (a.district_en || a.district_ka);

/* ---------- data ---------- */
function items(){
  const ref = parseISO(data.updated_at) + TB, now = nowWall();
  return (data.alerts || []).map(a => {
    const {start, end} = parseTimes(a.email_text, ref);
    const done = end != null && end <= now;
    let pct = null;
    if (done) pct = 100;
    else if (start != null && end != null && end > start) pct = Math.max(2, Math.min(100, (now - start) / (end - start) * 100));
    return {a, start, end, done, pct};
  }).filter(r => !(r.done && now - r.end > 12 * 36e5))
    .sort((x, y) => {
      const rk = o => o.done ? 2 : (o.end == null ? 1 : 0);
      return rk(x) - rk(y) || (x.end ?? 0) - (y.end ?? 0);
    });
}

async function load(){
  $('app').classList.add('busy');
  try {
    const r = await fetch(DATA_URL, {cache:'no-store'});
    if (!r.ok) throw new Error(r.status);
    const j = await r.json();
    if (!j || !Array.isArray(j.alerts)) throw new Error('shape');
    data = j; fresh = true;
    store.set('cache', JSON.stringify(j));
  } catch (e) { fresh = false; }
  loaded = true;
  $('app').classList.remove('busy');
  render();
  notifyNew();
}

/* ---------- views ---------- */
function installState(){
  const standalone = matchMedia('(display-mode: standalone)').matches || navigator.standalone === true;
  if (standalone) return null;
  const ios = /iphone|ipad|ipod/i.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
  if (deferred) return 'prompt';
  if (ios) return 'ios';
  return 'generic';
}

function hero(rows, scope){
  const active = rows.filter(r => !r.done);
  const now = nowWall();
  if (!active.length) {
    return `<section class="hero clear fade"><div class="tile">${ic('check-circle-fill')}</div><div><div class="t">${t('none')}</div><div class="s">${esc(scope)}</div></div></section>`;
  }
  const ends = active.filter(r => r.end != null).map(r => r.end);
  const scopeRow = `<div class="scope">${ic('map-pin-fill')}${esc(scope)}</div>`;
  if (!ends.length) {
    return `<section class="hero fade">${scopeRow}<div class="label">${t('returns')}</div><div class="time">–</div><div class="sub">${t('noTime')}</div></section>`;
  }
  const lo = Math.min(...ends), hi = Math.max(...ends);
  if (active.length === 1 || lo === hi) {
    const txt = when(lo, now);
    return `<section class="hero fade">${scopeRow}<div class="label">${t('returnsAt')}</div><div class="time num${txt.length > 6 ? ' sm' : ''}">${esc(txt)}</div><div class="sub">${t('xLeft', {x: left(lo - now)})}</div></section>`;
  }
  return `<section class="hero fade">${scopeRow}<div class="label">${t('returnsBetween')}</div><div class="time sm num">${esc(when(lo, now))} – ${esc(when(hi, now))}</div><div class="sub">${t('activeN', {n: active.length})}<br>${t('nextBack', {x: left(lo - now)})}</div></section>`;
}

function card(r, now){
  const a = r.a;
  const more = tx(streetsOf(a));
  const planned = /დაგეგმ/.test(a.type || '') && !/არაგეგმ/.test(a.type || '');
  const kind = planned ? t('planned') : t('unplanned');
  const open = openIds.has(a.id);
  const left1 = r.end == null ? `<span class="lbl">${t('returns')}</span><strong class="big sm">${t('noTime')}</strong>`
                              : `<span class="lbl">${t('returns')}</span><strong class="big num">${esc(when(r.end, now))}</strong>`;
  const right = r.end == null ? '' : `<div><span class="lbl">${t('left')}</span><strong class="mid num">${r.done ? t('passedVal') : esc(left(r.end - now))}</strong></div>`;
  const track = r.pct == null ? '' :
    `<div class="track"><i style="width:${r.pct.toFixed(1)}%"></i></div>` +
    (r.start != null && r.end != null ? `<div class="range num"><span>${esc(when(r.start, now))}</span><span>${esc(when(r.end, now))}</span></div>` : '');
  return `<li class="card${r.done ? ' done' : ''}${open ? ' open' : ''}" data-id="${esc(a.id)}">
    <div class="top">
      <span class="tile">${ic(r.done ? 'drop-duotone' : 'drop-slash-duotone')}</span>
      <div class="ttl"><h3>${esc(tx(clean(a.address)))}</h3><p>${esc(dName(a))} · ${esc(kind)}</p></div>
      <span class="pill">${r.done ? t('passed') : t('ongoing')}</span>
    </div>
    <div class="metrics"><div>${left1}</div>${right}</div>
    ${track}
    ${more ? `<div class="streets"><div class="st-h">${ic('map-pin-duotone')}${t('streets')}</div><p class="st-t${open ? '' : ' clamp'}">${esc(more)}</p><button type="button" class="more" hidden>${open ? t('less') : t('more')}</button></div>` : ''}
  </li>`;
}

function outagesView(){
  const all = items(), now = nowWall();
  const names = new Map(DISTRICTS);
  all.forEach(r => { if (r.a.district_en && !names.has(r.a.district_en)) names.set(r.a.district_en, r.a.district_ka || r.a.district_en); });
  const counts = new Map();
  all.forEach(r => { if (!r.done) counts.set(r.a.district_en, (counts.get(r.a.district_en) || 0) + 1); });
  if (sel !== 'all' && !names.has(sel)) sel = 'all';
  const order = [...names.keys()].sort((x, y) => (counts.get(y) || 0) - (counts.get(x) || 0) || x.localeCompare(y));
  const label = en => lang === 'ka' ? names.get(en) : en;
  const chips = [`<button type="button" class="chip" data-d="all" aria-pressed="${sel === 'all'}">${t('all')}</button>`]
    .concat(order.map(en => `<button type="button" class="chip" data-d="${esc(en)}" aria-pressed="${sel === en}">${esc(label(en))}${counts.get(en) ? `<em>${counts.get(en)}</em>` : ''}</button>`)).join('');
  const rows = all.filter(r => sel === 'all' || r.a.district_en === sel);
  const scope = sel === 'all' ? t('all') : label(sel);

  let notes = '';
  if (loaded && (fresh === false || Date.now() - parseISO(data.updated_at) > 3 * 36e5)) {
    notes += `<div class="note warn">${ic('wifi-slash-bold')}<div class="grow">${t('stale')}</div></div>`;
  }
  return `<div class="fade">${notes}<div class="chips" id="chips">${chips}</div>${hero(rows, scope)}<ul class="cards">${rows.map(r => card(r, now)).join('')}</ul></div>`;
}

function segBtn(attr, val, cur, label, icon){
  return `<button type="button" data-${attr}="${val}" aria-pressed="${cur === val}">${icon ? ic(icon) : ''}${label}</button>`;
}
function settingsView(){
  const inst = installState();
  let rows = '';
  if (inst === 'prompt') rows += `<button type="button" class="rowbtn" data-act="install">${ic('download-simple-bold')}<span class="grow">${t('install')}<small>${t('installSub')}</small></span></button>`;
  else if (inst === 'ios') rows += `<div class="rowbtn">${ic('plus-square-duotone')}<span class="grow">${t('install')}<small>${t('iosHint', {share: ic('export-bold', 'inl')})}</small></span></div>`;
  else if (inst === 'generic') rows += `<div class="rowbtn">${ic('plus-square-duotone')}<span class="grow">${t('install')}<small>${t('generic')}</small></span></div>`;
  if (TELEGRAM_URL) rows += `<a class="rowbtn" href="${esc(TELEGRAM_URL)}" target="_blank" rel="noopener">${ic('telegram-logo-fill')}<span class="grow">${t('telegram')}</span>${ic('arrow-square-out-bold', 'chev')}</a>`;
  if (navigator.share) rows += `<button type="button" class="rowbtn" data-act="share">${ic('share-network-duotone')}<span class="grow">${t('shareApp')}</span></button>`;
  return `<div class="fade"><h2 class="h2">${t('settings')}</h2>
    <div class="group">
      <div class="blk"><div class="blk-h">${ic('palette-duotone')}${t('appearance')}</div>
        <div class="seg">${segBtn('theme','system',theme,t('system'),'circle-half-duotone')}${segBtn('theme','light',theme,t('light'),'sun-duotone')}${segBtn('theme','dark',theme,t('dark'),'moon-duotone')}</div></div>
      <div class="blk"><div class="blk-h">${ic('translate-duotone')}${t('language')}</div>
        <div class="seg">${segBtn('lang','ka',lang,'ქართული')}${segBtn('lang','en',lang,'English')}</div></div>
    </div>
    ${rows ? `<div class="group">${rows}</div>` : ''}
    <div class="group about"><p>${t('about')}</p><p><a href="https://www.gwp.ge" target="_blank" rel="noopener">${t('source')}</a></p><p>${t('credits')}</p></div></div>`;
}

function renderNav(){
  const item = (id, icon, label) => `<button type="button" data-tab="${id}" ${tab === id ? 'aria-current="page"' : ''}>${ic(icon + (tab === id ? '-fill' : '-regular'))}${label}</button>`;
  $('nav').firstElementChild.innerHTML = item('mine', 'map-pin', t('mine')) + item('outages', 'drop', t('outages')) + item('settings', 'gear-six', t('settings'));
}

function fitClamps(){
  document.querySelectorAll('.st-t').forEach(p => {
    const b = p.parentElement.querySelector('.more');
    if (!b) return;
    const card = p.closest('.card');
    b.hidden = card.classList.contains('open') ? false : !(p.scrollHeight > p.clientHeight + 1);
  });
}

function render(){
  if (!data) return;
  if (tab === 'mine' && document.activeElement && document.activeElement.id === 'ws') return;
  document.documentElement.lang = lang;
  $('title').textContent = t('title');
  $('refresh').setAttribute('aria-label', t('refresh'));
  const upd = parseISO(data.updated_at), nd = Math.floor((upd + TB) / DAY) !== Math.floor(nowWall() / DAY);
  $('stamp').textContent = t('updated') + ' ' + (nd ? p2(new Date(upd + TB).getUTCDate()) + '.' + p2(new Date(upd + TB).getUTCMonth() + 1) + ' ' : '') + clock(upd + TB);
  $('app').classList.toggle('stale', loaded && (fresh === false || Date.now() - upd > 3 * 36e5));
  const y = window.scrollY;
  $('screen').innerHTML = tab === 'outages' ? outagesView() : tab === 'mine' ? mineView() : settingsView();
  renderNav();
  fitClamps();
  window.scrollTo(0, y);
  const on = $('screen').querySelector('.chip[aria-pressed=true]');
  if (on && tab === 'outages' && !render.once) { on.scrollIntoView({inline:'center', block:'nearest'}); render.once = true; }
}

function applyTheme(){
  const dark = theme === 'dark' || (theme === 'system' && matchMedia('(prefers-color-scheme: dark)').matches);
  document.documentElement.dataset.theme = dark ? 'dark' : 'light';
  $('tc').setAttribute('content', dark ? '#0A0F15' : '#F3F5F8');
}

/* ---------- my water: saved streets, alerts, install popup ---------- */
let watch = []; try { watch = JSON.parse(store.get('watch')) || []; } catch (e) {}
let alertsOn = store.get('alerts') === '1' && 'Notification' in window && Notification.permission === 'granted';
let sheetShown = false, sheetReady = false;
const dl = en => { const f = DISTRICTS.find(d => d[0] === en); return f ? (lang === 'ka' ? f[1] : f[0]) : en; };

async function readState(){ try { const r = await (await caches.open('tbw-state')).match('state.json'); return r ? await r.json() : {}; } catch (e) { return {}; } }
async function writeState(s){ try { await (await caches.open('tbw-state')).put('state.json', new Response(JSON.stringify(s))); } catch (e) {} }
async function syncWatch(){ const s = await readState(); s.list = watch; s.title = t('notifTitle'); await writeState(s); }

async function notifyNew(){
  if (!alertsOn || !watch.length || !data) return;
  const s = await readState(), seen = new Set(s.seen || []);
  s.list = watch; s.title = t('notifTitle');
  const reg = navigator.serviceWorker ? await navigator.serviceWorker.getRegistration() : null;
  const now = nowWall();
  for (const r of items()) {
    if (!watch.some(w => TBW.hit(w, r.a)) || seen.has(r.a.id)) continue;
    seen.add(r.a.id);
    if (r.done) continue;
    const body = tx(clean(r.a.address)) + (r.end != null ? ' · ' + t('returnsAt') + ' ' + when(r.end, now) : '');
    try {
      if (reg) await reg.showNotification(t('notifTitle'), {body, icon: 'icons/icon-192.png', tag: r.a.id});
      else new Notification(t('notifTitle'), {body});
    } catch (e) {}
  }
  s.seen = [...seen].slice(-200);
  await writeState(s);
}

async function enableAlerts(){
  if (!('Notification' in window)) return;
  const p = await Notification.requestPermission();
  alertsOn = p === 'granted'; store.set('alerts', alertsOn ? '1' : '0');
  if (alertsOn) {
    await syncWatch();
    try { const reg = await navigator.serviceWorker.ready; if (reg.periodicSync) await reg.periodicSync.register('tbw-check', {minInterval: 36e5}); } catch (e) {}
    notifyNew();
  }
  render();
}

function mineView(){
  const all = items(), now = nowWall(), cards = new Map();
  const places = watch.map((w, i) => {
    const hits = all.filter(r => !r.done && TBW.hit(w, r.a));
    hits.forEach(r => cards.set(r.a.id, r));
    const cut = hits.length > 0, key = 'last:' + w.d + '|' + w.s;
    if (cut) store.set(key, String(now));
    const ends = hits.map(r => r.end).filter(x => x != null), end = ends.length ? Math.max(...ends) : null;
    const last = +store.get(key) || 0, ld = new Date(last);
    const sub = cut ? (end != null ? `${t('returnsAt')} ${when(end, now)} · ${t('xLeft', {x: left(end - now)})}` : t('noTime'))
                    : (last ? `${t('lastCut')} ${p2(ld.getUTCDate())}.${p2(ld.getUTCMonth() + 1)}` : t('quiet'));
    return `<li class="card"><div class="top"><span class="tile${cut ? '' : ' okt'}">${ic(cut ? 'drop-slash-duotone' : 'check-circle-fill')}</span>
      <div class="ttl"><h3>${esc(w.s ? tx(w.s) : t('wholeDistrict'))}</h3><p>${esc(dl(w.d))}</p><p>${esc(sub)}</p></div>
      <span class="pill${cut ? '' : ' okp'}">${cut ? t('cutNow') : t('waterOk')}</span></div>
      <button type="button" class="rm" data-act="delplace" data-i="${i}">${t('remove')}</button></li>`;
  }).join('');
  let alertRow = '';
  if (watch.length) {
    if (alertsOn) alertRow = `<div class="note">${ic('check-circle-fill')}<div class="grow">${t('alertsOn')}</div></div>`;
    else if ('Notification' in window) alertRow = `<div class="note"><div class="grow">${t('alertsAsk')}</div><button type="button" class="btn" data-act="alerts">${t('enable')}</button></div>`;
    else alertRow = `<div class="note"><div class="grow">${t('alertsIos')}</div></div>`;
  }
  const opts = DISTRICTS.map(([en]) => `<option value="${esc(en)}"${en === sel ? ' selected' : ''}>${esc(dl(en))}</option>`).join('');
  const form = `<div class="group"><div class="blk"><div class="blk-h">${ic('map-pin-duotone')}${t('addPlace')}</div>
    <div class="form"><select class="in" id="wd" aria-label="District">${opts}</select>
    <input class="in" id="ws" maxlength="40" placeholder="${esc(t('streetPh'))}" autocomplete="off">
    <button type="button" class="btn big" data-act="addplace">${t('add')}</button></div><p class="hint">${t('streetHint')}</p></div></div>`;
  return `<div class="fade"><h2 class="h2">${t('mine')}</h2>${watch.length ? '' : `<p class="hint" style="margin:0 4px">${t('setup')}</p>`}${alertRow}
    <ul class="cards">${places}</ul>${cards.size ? `<ul class="cards">${[...cards.values()].map(r => card(r, now)).join('')}</ul>` : ''}${watch.length < 5 ? form : ''}</div>`;
}

function maybeSheet(){
  if (sheetShown) return;
  const inst = installState(); if (!inst || inst === 'generic') return;
  const n = +store.get('instN') || 0, last = +store.get('instT') || 0;
  if (n >= 3 || Date.now() - last < 3 * DAY) return;       // at most 3 times, 3 days apart
  sheetShown = true; store.set('instN', String(n + 1)); store.set('instT', String(Date.now()));
  const el = document.createElement('div'); el.id = 'sheet'; el.className = 'sheet';
  el.innerHTML = `<button type="button" class="sheet-bg" data-act="later" aria-label="Close"></button>
    <div class="sheet-card" role="dialog" aria-modal="true"><img src="icons/icon-192.png" alt="" width="56" height="56">
    <h2>${t('installTitle')}</h2><p>${inst === 'prompt' ? t('installBody') : t('iosHint', {share: ic('export-bold', 'inl')})}</p>
    ${inst === 'prompt' ? `<button type="button" class="btn big" data-act="installnow">${t('installBtn')}</button>` : ''}
    <button type="button" class="ghost" data-act="later">${t('later')}</button></div>`;
  document.body.appendChild(el);
}
const closeSheet = () => { const s = $('sheet'); if (s) s.remove(); };

/* ---------- events ---------- */
document.addEventListener('click', async e => {
  const b = e.target.closest('button,a'); if (!b) return;
  if (b.dataset.tab) { tab = b.dataset.tab; window.scrollTo(0, 0); render(); return; }
  if (b.dataset.d) { sel = b.dataset.d; store.set('district', sel); render(); return; }
  if (b.dataset.theme) { theme = b.dataset.theme; store.set('theme', theme); applyTheme(); render(); return; }
  if (b.dataset.lang) { lang = b.dataset.lang; store.set('lang', lang); render(); return; }
  if (b.id === 'refresh') { load(); return; }
  if (b.classList.contains('more')) {
    const c = b.closest('.card'), id = c.dataset.id, o = !c.classList.contains('open');
    c.classList.toggle('open', o); c.querySelector('.st-t').classList.toggle('clamp', !o);
    b.textContent = o ? t('less') : t('more'); o ? openIds.add(id) : openIds.delete(id); fitClamps(); return;
  }
  const act = b.dataset.act;
  if (act === 'dismiss') { store.set('dismissInstall', '1'); render(); }
  if (act === 'later') closeSheet();
  if (act === 'alerts') enableAlerts();
  if (act === 'delplace') { watch.splice(+b.dataset.i, 1); store.set('watch', JSON.stringify(watch)); syncWatch(); render(); }
  if (act === 'addplace') {
    const d = $('wd').value, s = $('ws').value.trim();
    if (watch.length < 5 && !watch.some(w => w.d === d && w.s === s)) { watch.push({d, s}); store.set('watch', JSON.stringify(watch)); await syncWatch(); notifyNew(); render(); }
  }
  if ((act === 'install' || act === 'installnow') && deferred) { closeSheet(); deferred.prompt(); try { await deferred.userChoice; } catch (_) {} deferred = null; render(); }
  if (act === 'share') { try { await navigator.share({title: t('title'), url: location.href.split('?')[0]}); } catch (_) {} }
});
window.addEventListener('beforeinstallprompt', e => { e.preventDefault(); deferred = e; render(); if (sheetReady) maybeSheet(); });
window.addEventListener('appinstalled', () => { deferred = null; closeSheet(); render(); });
matchMedia('(prefers-color-scheme: dark)').addEventListener?.('change', () => { if (theme === 'system') applyTheme(); });
document.addEventListener('visibilitychange', () => { if (!document.hidden) load(); });
setInterval(() => { if (!document.hidden && tab === 'outages') render(); }, 60e3);
setInterval(() => { if (!document.hidden) load(); }, 5 * 60e3);
document.fonts && document.fonts.ready.then(fitClamps);

/* ---------- start ---------- */
applyTheme();
try { data = JSON.parse(store.get('cache')); } catch (e) {}
if (!data || !Array.isArray(data.alerts)) data = SNAP;
render();
load();
setTimeout(() => { sheetReady = true; maybeSheet(); }, 2500);
if ('serviceWorker' in navigator && /^https?:$/.test(location.protocol)) navigator.serviceWorker.register('sw.js').catch(() => {});
</script>
</body>
